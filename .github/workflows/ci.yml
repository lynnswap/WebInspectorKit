name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Consumer API Contract Tests (iOS ${{ matrix.ios_major }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode_major: '26'
            ios_major: '26'
          - runner: xcode-27
            xcode_major: '27'
            ios_major: '27'
            allow_prerelease: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      XCODE_MAJOR: ${{ matrix.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ matrix.allow_prerelease }}
      IOS_MAJOR: ${{ matrix.ios_major }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve Xcode
        run: ruby .github/scripts/resolve-xcode.rb

      - name: Run macOS consumer contract tests
        working-directory: ContractTests
        run: |
          xcodebuild -quiet test \
            -scheme WebInspectorKitContractTests-Package \
            -destination 'platform=macOS,arch=arm64' \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO

      - name: Resolve iOS simulator destination
        run: ruby .github/scripts/resolve-ios-simulator.rb

      - name: Run iOS consumer contract tests
        working-directory: ContractTests
        run: |
          xcodebuild -quiet test \
            -scheme WebInspectorKitContractTests-Package \
            -destination "${DESTINATION}" \
            -only-testing:WebInspectorConsumerContractTests \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO

  script-tests:
    name: CI script tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'

  ios-runtime-tests:
    name: iOS runtimes on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode_major: '26.3'
            allow_prerelease: false
            include_workspace: false
          - runner: macos-26
            xcode_major: '26'
            allow_prerelease: false
            include_workspace: true
          - runner: xcode-27
            xcode_major: '27'
            allow_prerelease: true
            include_workspace: true
    uses: ./.github/workflows/workspace-tests.yml
    with:
      runner: ${{ matrix.runner }}
      xcode_major: ${{ matrix.xcode_major }}
      allow_prerelease: ${{ matrix.allow_prerelease }}
      include_workspace: ${{ matrix.include_workspace }}
