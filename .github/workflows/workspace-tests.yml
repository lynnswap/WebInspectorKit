name: Runtime Tests

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to build and test.
        required: true
        type: string
      runner:
        required: true
        type: string
      xcode_major:
        required: true
        type: string
      allow_prerelease:
        default: false
        type: boolean
      suite:
        description: native for current-major minors and latest older releases; workspace for the latest OS only.
        required: true
        type: string
      latest_ios_major:
        description: Newest iOS major covered by CI, including hosts without that major installed.
        type: number
        default: 27
      all_native_runtimes:
        description: Restore full Native runtime coverage for release validation.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test ${{ inputs.suite }} suites
    runs-on: ${{ inputs.runner }}
    # Full Native coverage visits every installed runtime sequentially.
    timeout-minutes: ${{ inputs.all_native_runtimes && 90 || 30 }}
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      TEST_SUITE: ${{ inputs.suite }}
      LATEST_IOS_MAJOR: ${{ inputs.latest_ios_major }}
      ALL_NATIVE_RUNTIMES: ${{ inputs.all_native_runtimes }}
      SPM_CACHE_DIR: ${{ github.workspace }}/.ci/spm-cache
      COMPILATION_CACHE_DIR: ${{ github.workspace }}/.ci/compilation-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check out CI automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Release targets can predate the automation used by this workflow.
          ref: ${{ github.workflow_sha }}
          path: .ci/automation
          persist-credentials: false
      - name: Resolve Xcode
        id: toolchain
        run: ruby .ci/automation/.github/scripts/resolve-xcode.rb
      - name: Restore Swift package cache
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SPM_CACHE_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ inputs.suite }}-${{ hashFiles('Package.resolved', 'ContractTests/Package.resolved', 'Monocly/**/Package.resolved', 'WebInspectorKit.xcworkspace/**/Package.resolved') }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILATION_CACHE_DIR }}
          key: compile-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ inputs.suite }}-${{ inputs.revision }}
          restore-keys: |
            compile-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ inputs.suite }}-
      - name: Build iOS test products
        id: build-ios
        continue-on-error: true
        run: |
          set -e -o pipefail
          scheme=WebInspectorKitTests
          if [[ "$TEST_SUITE" == native ]]; then
            scheme=WebInspectorNativeBridgeTests
          fi
          derived_data="$RUNNER_TEMP/build-iOS"
          xcodebuild build-for-testing \
            -workspace WebInspectorKit.xcworkspace -scheme "$scheme" \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$derived_data" \
            -enableCodeCoverage NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_DIR" \
            | tee "$RUNNER_TEMP/build-iOS.log"
          python3 .ci/automation/.github/scripts/prepare-xctestrun.py "$derived_data/Build/Products" \
            | tee "$RUNNER_TEMP/prepare-iOS.log"
      - name: Build macOS test products
        id: build-macos
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -e -o pipefail
          scheme=WebInspectorKit
          if [[ "$TEST_SUITE" == native ]]; then
            scheme=WebInspectorNativeBridgeTests
          fi
          derived_data="$RUNNER_TEMP/build-macOS"
          xcodebuild build-for-testing \
            -workspace WebInspectorKit.xcworkspace -scheme "$scheme" \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$derived_data" \
            -enableCodeCoverage NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_CAS_PATH="$COMPILATION_CACHE_DIR" \
            | tee "$RUNNER_TEMP/build-macOS.log"
          python3 .ci/automation/.github/scripts/prepare-xctestrun.py "$derived_data/Build/Products" \
            | tee "$RUNNER_TEMP/prepare-macOS.log"
      - name: Save Swift package cache
        if: ${{ !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' && (steps.build-ios.outcome == 'success' || steps.build-macos.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SPM_CACHE_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - name: Save compiler cache
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' && (steps.build-ios.outcome == 'success' || steps.build-macos.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILATION_CACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Test iOS runtimes
        id: test-ios
        if: ${{ !cancelled() && steps.build-ios.outcome == 'success' }}
        continue-on-error: true
        run: |
          coverage_args=()
          if [[ "$ALL_NATIVE_RUNTIMES" == "true" ]]; then
            coverage_args+=(--all-native-runtimes)
          fi
          python3 .ci/automation/.github/scripts/runtime-tests.py "$RUNNER_TEMP" \
            --suite "$TEST_SUITE" --latest-ios-major "$LATEST_IOS_MAJOR" \
            --platform iOS --reuse-simulators "${coverage_args[@]}"
      - name: Test macOS
        id: test-macos
        if: ${{ !cancelled() && steps.build-macos.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 .ci/automation/.github/scripts/runtime-tests.py "$RUNNER_TEMP" \
            --suite "$TEST_SUITE" --latest-ios-major "$LATEST_IOS_MAJOR" \
            --platform macOS
      - name: Check build and test results
        if: ${{ !cancelled() }}
        env:
          IOS_BUILD: ${{ steps.build-ios.outcome }}
          MACOS_BUILD: ${{ steps.build-macos.outcome }}
          IOS_TEST: ${{ steps.test-ios.outcome }}
          MACOS_TEST: ${{ steps.test-macos.outcome }}
        run: |
          test "$IOS_BUILD" = success && test "$MACOS_BUILD" = success \
            && test "$IOS_TEST" = success && test "$MACOS_TEST" = success
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ inputs.suite }}-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/prepare-*.log
            ${{ runner.temp }}/build-*/Build/Products/*.xctestrun
            ${{ runner.temp }}/runtime-tests
          if-no-files-found: ignore
