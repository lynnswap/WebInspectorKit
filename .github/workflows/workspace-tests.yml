name: Runtime Tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      xcode_major:
        required: true
        type: string
      allow_prerelease:
        default: false
        type: boolean
      suite:
        description: native for current-major minors and latest older releases; workspace for the latest OS only.
        required: true
        type: string

      latest_ios_major:
        description: Newest iOS major covered by CI, including hosts without that major installed.
        type: number
        default: 27
      all_native_runtimes:
        description: Restore full Native runtime coverage for release validation.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Build and test ${{ inputs.suite }} suites
    runs-on: ${{ inputs.runner }}
    # Native coverage runs runtimes sequentially, each with a ten-minute boot budget.
    # Use the hosted-runner ceiling; individual boot/test stalls remain bounded.
    timeout-minutes: ${{ inputs.suite == 'native' && 360 || 45 }}
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      TEST_SUITE: ${{ inputs.suite }}
      LATEST_IOS_MAJOR: ${{ inputs.latest_ios_major }}
      ALL_NATIVE_RUNTIMES: ${{ inputs.all_native_runtimes }}
      SPM_CACHE_DIR: ${{ github.workspace }}/.ci/spm-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve Xcode
        id: toolchain
        run: ruby .github/scripts/resolve-xcode.rb
      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SPM_CACHE_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ inputs.suite }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build each platform once
        run: |
          set -e -o pipefail
          for platform in iOS macOS; do
            if [[ "$platform" == iOS ]]; then
              destination='generic/platform=iOS Simulator'
              scheme=WebInspectorKitTests
            else
              destination='platform=macOS,arch=arm64'
              scheme=WebInspectorKit
            fi
            workspace=WebInspectorKit.xcworkspace
            if [[ "$TEST_SUITE" == native ]]; then
              scheme=WebInspectorNativeBridgeTests
            fi
            derived_data="$RUNNER_TEMP/build-$platform"
            xcodebuild build-for-testing \
              -workspace "$workspace" -scheme "$scheme" \
              -destination "$destination" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
              -disableAutomaticPackageResolution \
              -derivedDataPath "$derived_data" \
              -enableCodeCoverage NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              | tee "$RUNNER_TEMP/build-$platform.log"
            python3 .github/scripts/prepare-xctestrun.py "$derived_data/Build/Products"
          done
      - name: Test selected runtimes sequentially
        run: |
          coverage_args=()
          if [[ "$ALL_NATIVE_RUNTIMES" == "true" ]]; then
            coverage_args+=(--all-native-runtimes)
          fi
          python3 .github/scripts/runtime-tests.py "$RUNNER_TEMP" \
            --suite "$TEST_SUITE" --latest-ios-major "$LATEST_IOS_MAJOR" \
            "${coverage_args[@]}"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ inputs.suite }}-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/runtime-tests
          if-no-files-found: ignore
