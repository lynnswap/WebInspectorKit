name: Runtime Tests

on:
  workflow_call:
    inputs:
      revision:
        description: Exact commit to build and test.
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        description: Platform to build and test, iOS or macOS.
        required: true
        type: string
      xcode_major:
        required: true
        type: string
      allow_prerelease:
        default: false
        type: boolean
      suite:
        description: native for current-major minors and latest older releases; workspace for the latest OS only.
        required: true
        type: string

      latest_ios_major:
        description: Newest iOS major covered by CI, including hosts without that major installed.
        type: number
        default: 27
      all_native_runtimes:
        description: Restore full Native runtime coverage for release validation.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.suite }} suites for ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      TEST_SUITE: ${{ inputs.suite }}
      TEST_PLATFORM: ${{ inputs.platform }}
      LATEST_IOS_MAJOR: ${{ inputs.latest_ios_major }}
      ALL_NATIVE_RUNTIMES: ${{ inputs.all_native_runtimes }}
      SPM_CACHE_DIR: ${{ github.workspace }}/.ci/spm-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check out CI automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci/automation
          persist-credentials: false
      - name: Resolve Xcode
        id: toolchain
        run: ruby .ci/automation/.github/scripts/resolve-xcode.rb
      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SPM_CACHE_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ inputs.suite }}-${{ inputs.platform }}-${{ hashFiles('Package.resolved', 'ContractTests/Package.resolved', 'Monocly/**/Package.resolved', 'WebInspectorKit.xcworkspace/**/Package.resolved') }}
      - name: Build for testing
        run: |
          set -e -o pipefail
          if [[ "$TEST_PLATFORM" == iOS ]]; then
            destination='generic/platform=iOS Simulator'
            scheme=WebInspectorKitTests
          else
            destination='platform=macOS,arch=arm64'
            scheme=WebInspectorKit
          fi
          if [[ "$TEST_SUITE" == native ]]; then
            scheme=WebInspectorNativeBridgeTests
          fi
          derived_data="$RUNNER_TEMP/build-$TEST_PLATFORM"
          xcodebuild build-for-testing \
            -workspace WebInspectorKit.xcworkspace -scheme "$scheme" \
            -destination "$destination" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_DIR" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$derived_data" \
            -enableCodeCoverage NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            | tee "$RUNNER_TEMP/build-$TEST_PLATFORM.log"
          python3 .ci/automation/.github/scripts/prepare-xctestrun.py "$derived_data/Build/Products" \
            | tee "$RUNNER_TEMP/prepare-$TEST_PLATFORM.log"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/products-$TEST_PLATFORM.tar.gz" \
            -C "$derived_data/Build" Products
      - name: Select installed runtimes
        id: cases
        run: |
          coverage_args=()
          if [[ "$ALL_NATIVE_RUNTIMES" == "true" ]]; then
            coverage_args+=(--all-native-runtimes)
          fi
          cases=$(python3 .ci/automation/.github/scripts/runtime-tests.py "$RUNNER_TEMP" \
            --suite "$TEST_SUITE" --latest-ios-major "$LATEST_IOS_MAJOR" \
            --platform "$TEST_PLATFORM" --list-cases "${coverage_args[@]}")
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
      - name: Upload test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: products-${{ inputs.suite }}-${{ inputs.runner }}-${{ inputs.platform }}
          path: ${{ runner.temp }}/products-${{ inputs.platform }}.tar.gz
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-build-${{ inputs.suite }}-${{ inputs.runner }}-${{ inputs.platform }}
          path: |
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/prepare-*.log
            ${{ runner.temp }}/build-*/Build/Products/*.xctestrun
          if-no-files-found: ignore

  test:
    name: Test ${{ inputs.suite }} suites on ${{ matrix.case.platform }} ${{ matrix.case.version }}
    needs: build
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.build.outputs.cases) }}
    timeout-minutes: 10
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      TEST_SUITE: ${{ inputs.suite }}
      TEST_PLATFORM: ${{ matrix.case.platform }}
      TEST_RUNTIME: ${{ matrix.case.runtime }}
      LATEST_IOS_MAJOR: ${{ inputs.latest_ios_major }}
      ALL_NATIVE_RUNTIMES: ${{ inputs.all_native_runtimes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Check out CI automation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Release targets can predate the runner arguments used by this workflow.
          ref: ${{ github.workflow_sha }}
          path: .ci/automation
          persist-credentials: false
      - name: Resolve Xcode
        run: ruby .ci/automation/.github/scripts/resolve-xcode.rb
      - name: Download test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: products-${{ inputs.suite }}-${{ inputs.runner }}-${{ matrix.case.platform }}
          path: ${{ runner.temp }}
      - name: Extract test products
        run: |
          mkdir -p "$RUNNER_TEMP/build-$TEST_PLATFORM/Build"
          tar -xzf "$RUNNER_TEMP/products-$TEST_PLATFORM.tar.gz" \
            -C "$RUNNER_TEMP/build-$TEST_PLATFORM/Build"
      - name: Test selected runtime
        run: |
          coverage_args=()
          if [[ "$ALL_NATIVE_RUNTIMES" == "true" ]]; then
            coverage_args+=(--all-native-runtimes)
          fi
          if [[ "$TEST_PLATFORM" == "iOS" ]]; then
            coverage_args+=(--runtime "$TEST_RUNTIME")
          fi
          python3 .ci/automation/.github/scripts/runtime-tests.py "$RUNNER_TEMP" \
            --suite "$TEST_SUITE" --latest-ios-major "$LATEST_IOS_MAJOR" \
            --platform "$TEST_PLATFORM" --reuse-simulators \
            "${coverage_args[@]}"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ inputs.suite }}-${{ inputs.runner }}-${{ matrix.case.platform }}-${{ matrix.case.version }}
          path: |
            ${{ runner.temp }}/build-*/Build/Products/*.xctestrun
            ${{ runner.temp }}/runtime-tests
          if-no-files-found: ignore
