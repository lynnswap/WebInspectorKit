name: iOS Runtime Tests

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      xcode_major:
        required: true
        type: string
      allow_prerelease:
        default: false
        type: boolean
      include_workspace:
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    name: NativeBridge on the host macOS
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve Xcode
        run: ruby .github/scripts/resolve-xcode.rb
      - name: Test the host WebKit
        run: |
          set -e -o pipefail
          sw_vers
          xcodebuild build-for-testing \
            -workspace Packages/WebInspectorNativeBridge/WebInspectorNativeBridge.xcworkspace \
            -scheme WebInspectorNativeBridgeTests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/native-macos" \
            -enableCodeCoverage NO \
            | tee "$RUNNER_TEMP/native-macos-build.log"
          xctestrun="$(python3 .github/scripts/prepare-xctestrun.py "$RUNNER_TEMP/native-macos/Build/Products" --product native)"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination 'platform=macOS,arch=arm64' \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath "$RUNNER_TEMP/native-macos.xcresult" \
            | tee "$RUNNER_TEMP/native-macos-tests.log"
      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-macos-${{ inputs.runner }}
          path: |
            ${{ runner.temp }}/native-macos-*.log
            ${{ runner.temp }}/native-macos.xcresult
          if-no-files-found: ignore

  build:
    name: Build tests and discover installed runtimes
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      INCLUDE_WORKSPACE: ${{ inputs.include_workspace }}
      SPM_CACHE_DIR: ${{ github.workspace }}/.ci/spm-cache
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve Xcode
        id: toolchain
        run: ruby .github/scripts/resolve-xcode.rb
      - name: Discover all installed supported iOS runtimes
        id: runtimes
        run: |
          args=()
          if [[ "$INCLUDE_WORKSPACE" == true ]]; then
            args+=(--include-workspace)
          fi
          python3 .github/scripts/ios-runtime-matrix.py discover "${args[@]}"
      - name: Select build destination
        env:
          BUILD_RUNTIME: ${{ steps.runtimes.outputs.build-runtime }}
        run: python3 .github/scripts/ios-runtime-matrix.py resolve --runtime "$BUILD_RUNTIME"
      - name: Restore Swift package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.SPM_CACHE_DIR }}
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-id }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build once for the installed runtimes
        run: |
          set -e -o pipefail
          products=(native)
          if [[ "$INCLUDE_WORKSPACE" == true ]]; then
            products+=(workspace)
          fi
          for product in "${products[@]}"; do
            if [[ "$product" == native ]]; then
              workspace=Packages/WebInspectorNativeBridge/WebInspectorNativeBridge.xcworkspace
              scheme=WebInspectorNativeBridgeTests
            else
              workspace=WebInspectorKit.xcworkspace
              scheme=WebInspectorKitTests
            fi
            derived_data="$RUNNER_TEMP/build-$product"
            xcodebuild build-for-testing \
              -workspace "$workspace" -scheme "$scheme" \
              -destination "$DESTINATION" \
              -clonedSourcePackagesDirPath "$SPM_CACHE_DIR/$product" \
              -disableAutomaticPackageResolution \
              -derivedDataPath "$derived_data" \
              -enableCodeCoverage NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
              | tee "$RUNNER_TEMP/build-$product.log"
            tar -C "$derived_data/Build/Products" -czf "$RUNNER_TEMP/$product-tests.tar.gz" .
          done
      - name: Upload built tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-products-${{ inputs.runner }}
          path: ${{ runner.temp }}/*-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-diagnostics-${{ inputs.runner }}
          path: ${{ runner.temp }}/build-*.log
          if-no-files-found: ignore

  test:
    name: iOS ${{ matrix.version }} / ${{ matrix.suite }}
    needs: build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      XCODE_MAJOR: ${{ inputs.xcode_major }}
      XCODE_ALLOW_PRERELEASE: ${{ inputs.allow_prerelease }}
      RUNTIME_ID: ${{ matrix.runtime }}
      TEST_PRODUCT: ${{ matrix.product }}
      TEST_FILTER: ${{ matrix.test_filter }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Resolve Xcode
        run: ruby .github/scripts/resolve-xcode.rb
      - name: Select the exact runtime
        run: python3 .github/scripts/ios-runtime-matrix.py resolve --runtime "$RUNTIME_ID"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-test-products-${{ inputs.runner }}
          path: ${{ runner.temp }}/test-products
      - name: Run tests against the installed WebKit
        run: |
          set -e -o pipefail
          mkdir -p "$RUNNER_TEMP/tests"
          tar -C "$RUNNER_TEMP/tests" -xzf "$RUNNER_TEMP/test-products/$TEST_PRODUCT-tests.tar.gz"
          xctestrun="$(python3 .github/scripts/prepare-xctestrun.py "$RUNNER_TEMP/tests" --product "$TEST_PRODUCT")"
          bash Scripts/ci-xcodebuild-watchdog.sh \
            xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "$DESTINATION" \
            "-only-testing:$TEST_FILTER" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            | tee "$RUNNER_TEMP/tests.log"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-tests-${{ inputs.runner }}-${{ matrix.version }}-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/tests.xcresult
          if-no-files-found: ignore
